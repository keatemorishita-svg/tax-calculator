<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人所得税计算器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <h1>个人所得税计算器</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-salary">工资薪金</button>
    <button class="tab-btn" data-tab="tab-bonus">年终奖优化</button>
  </div>

  <div class="tab-panel active" id="tab-salary">
    <div class="card">
      <div class="card-title">社保公积金设置</div>
      <div class="form-row">
        <div class="form-group">
          <label>养老保险</label>
          <span>8% (自动)</span>
        </div>
        <div class="form-group">
          <label>医疗保险</label>
          <span>2% (自动)</span>
        </div>
        <div class="form-group">
          <label>失业保险</label>
          <span>0.5% (自动)</span>
        </div>
        <div class="form-group">
          <label>住房公积金比例</label>
          <div class="range-container">
            <input type="range" id="housing-fund-rate" min="5" max="12" value="5">
            <span id="housing-fund-label">5%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">专项附加扣除</div>
      <div class="deductions-section">
        <div class="form-group">
          <label>子女教育 (每个2,000元/月)</label>
          <input type="number" id="children-count" min="0" max="10" placeholder="子女数量">
        </div>
        <div class="form-group">
          <label>继续教育</label>
          <label><input type="checkbox" id="education-academic"> 学历教育 (400元/月)</label>
          <label><input type="checkbox" id="education-vocational"> 职业资格 (3,600元/年)</label>
        </div>
        <div class="form-group">
          <label>住房贷款利息 (1,000元/月)</label>
          <input type="checkbox" id="housing-loan">
        </div>
        <div class="form-group">
          <label>住房租金</label>
          <select id="housing-rent">
            <option value="0">不选</option>
            <option value="1">1,500元/月 (京沪广深)</option>
            <option value="2">1,100元/月 (大城市)</option>
            <option value="3">800元/月 (其他城市)</option>
          </select>
        </div>
        <div class="form-group">
          <label>赡养老人</label>
          <label><input type="checkbox" id="elderly-only"> 独生子女 (3,000元/月)</label>
          <label><input type="checkbox" id="elderly-share"> 非独生子女 (分摊≤1,500元/月)</label>
        </div>
        <div class="form-group">
          <label>3岁以下婴幼儿照护 (每个2,000元/月)</label>
          <input type="number" id="infant-count" min="0" max="10" placeholder="婴幼儿数量">
        </div>
        <div class="form-group">
          <label>大病医疗 (年度汇算，超15,000元部分，上限80,000元)</label>
          <input type="number" id="medical-annual" min="0" placeholder="实际发生额">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">每月工资输入</div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>月份</th>
              <th>应发工资</th>
              <th>社保</th>
              <th>公积金</th>
              <th>专项扣除</th>
              <th>累计应纳税所得额</th>
              <th>当月预扣个税</th>
              <th>累计预扣个税</th>
            </tr>
          </thead>
          <tbody id="salary-table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-title">年度汇总</div>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="label">全年收入</div>
          <div class="value" id="summary-total-salary">0</div>
        </div>
        <div class="summary-item">
          <div class="label">社保合计</div>
          <div class="value" id="summary-total-social">0</div>
        </div>
        <div class="summary-item">
          <div class="label">公积金合计</div>
          <div class="value" id="summary-total-housing">0</div>
        </div>
        <div class="summary-item">
          <div class="label">专项附加扣除合计</div>
          <div class="value" id="summary-total-special">0</div>
        </div>
        <div class="summary-item">
          <div class="label">全年应纳个税</div>
          <div class="value tax" id="summary-total-tax">0</div>
        </div>
        <div class="summary-item">
          <div class="label">税后到手</div>
          <div class="value after-tax" id="summary-after-tax">0</div>
        </div>
        <div class="summary-item">
          <div class="label">平均税率</div>
          <div class="value" id="summary-avg-rate">0%</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="tab-bonus">
    <div class="card">
      <div class="card-title">年终奖方案优化</div>
      <div class="form-row">
        <div class="form-group">
          <label>年终奖金额（元）</label>
          <input type="number" id="bonus-input" min="0" step="1000" placeholder="输入年终奖金额">
        </div>
      </div>
      <div id="bonus-result">
        <p class="hint">请输入年终奖金额查看方案对比</p>
      </div>
    </div>

    <div class="card">
      <div class="card-title">保存方案对比</div>
      <button class="btn btn-primary" id="save-bonus-btn">保存当前方案</button>
    </div>

    <div class="card">
      <div class="card-title">历史方案对比</div>
      <div id="bonus-history">
        <p class="hint">暂无保存记录</p>
      </div>
    </div>
  </div>
</div>

<script src="js/tax-tables.js"></script>
<script src="js/calculator.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
